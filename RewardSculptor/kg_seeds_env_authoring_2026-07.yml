  - arxiv_id: "1901.01753"
    title: "Paired Open-Ended Trailblazer (POET): Endlessly Generating Increasingly Complex and Diverse Learning Environments and Their Solutions"
    year: 2019
    tier: "A"
    tags: ["terrain", "parkour", "ued-curricula"]
    rationale: "[terrain+parkour+ued-curricula] Grounds the 'learnability filter' for generated terrain: any auto-generated environment should be admitted to the training pool only if current policy performance falls in a band (not solved, not hopeless). Also a caution: a single linear difficulty scalar can dead-end; maintaining a diverse population of terrain variants avoids curriculum local optima. Grounds the learnability filter in course generation: generated courses should be admitted to the training set only if current policy performance falls in a target band — a minimal-criterion check the authoring pipeline can run cheaply in parallel sim before committing training compute. Grounds two mechanisms: (1) the minimal-criterion admission gate — an authored env enters the training pool only if current-policy score falls inside a band (POET used reward bounds on parent agents); (2) cross-env transfer tests — periodically evaluating the policy on all archived envs to detect which env is now the best stepping stone. Both are cheap for a diagnoser to run."
  - arxiv_id: "1707.02286"
    title: "Emergence of Locomotion Behaviours in Rich Environments"
    year: 2017
    tier: "A"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] The founding argument that terrain authoring is a substitute for reward engineering: complex skills can come from the environment distribution rather than the reward. For RewardSculptor this justifies making the terrain schema a first-class peer of the reward sculpting loop, and grounds 'randomize parameters per episode within a band' as the baseline curriculum before anything adaptive. Grounds the minimal-reward premise of environment authoring: if the course generator supplies diverse parameterized obstacles, a simple progress-along-course reward suffices — reward complexity can be traded for course complexity, which is exactly RewardSculptor's leverage point."
  - arxiv_id: "2602.11143"
