  - arxiv_id: "2601.07718"
    title: "Hiking in the Wild: A Scalable Perceptive Parkour Framework for Humanoids"
    year: 2026
    tier: "A"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Two schema-level primitives worth copying: the terrain generator should expose (1) an edge/gradient map so foothold-safety rewards can be computed from the schema, and (2) a validity query for sampling reachable goal locations on arbitrary generated terrain — goal placement is part of the environment spec, and naive placement produces reward hacking. Grounds goal placement rules: the course authoring pipeline should sample waypoints/goals only from validated flat patches of the generated geometry (never on edges or inside obstacles), and export edge maps so foothold-safety terms can be computed against authored geometry."
  - arxiv_id: "2502.10363"
