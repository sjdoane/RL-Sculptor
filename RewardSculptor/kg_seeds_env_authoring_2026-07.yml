    year: 2023
    tier: "A"
    tags: ["terrain"]
    rationale: "[terrain] Grounds two schema/curriculum choices: (1) risky terrain types (gaps, beams, stones) pair better with goal-reaching task specs than velocity commands — the environment schema should carry a task-mode field; (2) generalist-then-specialist ordering: train on a disordered union of a terrain family before narrowing to an extreme instance."
  - arxiv_id: "2211.07638"
