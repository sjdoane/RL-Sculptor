  - arxiv_id: "1705.06366"
    title: "Automatic Goal Generation for Reinforcement Learning Agents"
    year: 2017
    tier: "A"
    tags: ["objects", "ued-curricula"]
    rationale: "[objects+ued-curricula] Grounds making the goal-sampling distribution a first-class, adaptable schema field (not a hard-coded uniform range): a generated task should declare its goal space and permit difficulty-adaptive sampling over it — e.g., ball spawn distance to goal expanding with success rate. The original formalization of success-rate-banded promotion — the same rule appearing as the 50-75% band in parkour curricula. Grounds the diagnoser's promotion policy: an authored env config is 'in-curriculum' iff its measured success rate is within the band; below → simplify or hold; above → promote/mutate harder. The band bounds are the tunable, and this paper shows the mechanism is robust to their exact values."
  - arxiv_id: "2410.23208"
    title: "Kinetix: Investigating the Training of General Agents through Open-Ended Physics-Based Control Tasks"
    year: 2024
    tier: "A"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] Verified real (Matthews, Beukman, Lu, Foerster; ICLR 2025 oral). Grounds the payoff claim for building a parametric env space at all: broad pretraining over an authored task distribution buys zero-shot and warm-start capability that single-env training cannot, which is the argument for RewardSculptor training across the whole authored env distribution rather than sequentially mastering one env at a time. Its unified goal representation also shows how a fixed goal schema keeps an open task space learnable by one policy."
  - arxiv_id: "2311.01885"
    title: "Domain Randomization via Entropy Maximization"
    year: 2023
    tier: "A"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] Upgrades ADR's per-boundary heuristic into a principled objective the diagnoser can optimize: 'maximize env-distribution entropy s.t. success >= alpha' is a one-line rule an LLM diagnoser can be prompted to enforce when editing parameter ranges. The success-probability constraint (their alpha) is the same knob as the parkour success band — this paper gives it a formal justification."
  - arxiv_id: "2107.12808"
    title: "Open-Ended Learning Leads to Generally Capable Agents"
    year: 2021
    tier: "A"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] The reference answer to 'how do you parameterize a space of tasks rather than a single task': a compositional grammar with (a) world parameters, (b) goal predicates, and (c) normalized cross-task scoring so difficulty is comparable across authored envs. For RewardSculptor this grounds making the LLM author emit envs in a constrained schema/grammar (the validated env-spec surface) rather than free-form code, and normalizing returns per-env before any cross-env difficulty comparison."
  - arxiv_id: "2010.03934"
    title: "Prioritized Level Replay"
    year: 2020
    tier: "A"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] Grounds the level-replay buffer as a first-class component: RewardSculptor should keep a persistent archive of authored env configs scored by value-loss and staleness, and mix replayed configs with newly authored ones each iteration rather than training only on the newest LLM output. The staleness term matters — scores of old configs go stale as the policy improves."
  - arxiv_id: "1910.07224"
    title: "Teacher algorithms for curriculum learning of Deep RL in continuously parameterized environments"
    year: 2019
    tier: "A"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] The reference mechanism for difficulty metrics over a continuous authored parameter space: learning progress (change in return per env-region), not absolute performance, is the selection signal, which automatically abandons both mastered and currently-unlearnable regions. A diagnoser can implement this directly by binning env-spec parameters and tracking per-bin return deltas between iterations."

