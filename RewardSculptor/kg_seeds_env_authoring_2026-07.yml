# §Env-authoring research sweep 2026-07-18 — KG expansion seeds.
#
# Corpus behind the prompt-driven environment-authoring architecture
# (docs/internal/ENV_AUTHORING_ARCHITECTURE.md): six survey domains —
# (A) LLM env/task generation, (B) procedural terrain + curricula,
# (C) parkour/obstacle courses, (D) robot-object interaction and
# goal-conditioned tasks, (E) UED/open-endedness/auto-curricula,
# (F) simulation scene-building frameworks. 130 surveyed entries were
# deduped to 102 unique papers and curated to the 89 below; every
# arxiv id was verified against its abstract page at survey time.
# Rationales state the SPECIFIC design decision each paper grounds,
# per kg_seeds_campaign.yml convention.
#
# Ingest:  SCULPTOR_KG_PATH=<shared> ingest_from_seeds(this file)
# Extract: sculpt kg extract --seeds kg_seeds_env_authoring_2026-07.yml --tier S
#          performs the selected hybrid pass; A/B extraction remains deliberate.

papers:

  # ── S-tier (extraction targets) ───────────────────────────────
  - arxiv_id: "2411.01775"
    title: "Eurekaverse: Environment Curriculum Generation via Large Language Models"
    year: 2024
    tier: "S"
    tags: ["llm-env-gen", "terrain", "parkour", "ued-curricula"]
    rationale: "[llm-env-gen+terrain+parkour+ued-curricula] Directly grounds terrain-as-code for legged locomotion: represent terrain as a parametric generator function the LLM writes/edits, and drive curriculum promotion by feeding per-terrain success statistics back into the next generation round. Also grounds keeping a *set* of environments per stage (diversity guard against overfitting) rather than a single evolving one. The single most direct precedent for RewardSculptor's milestone — it is Eureka-for-terrain. Grounds the core architecture: LLM emits terrain code/parameters against a fixed generator API, an evaluation loop feeds back per-terrain traversal stats, and the LLM iterates (generate -> train -> score -> regenerate). Strongly suggests keeping the generator API small and heightfield-based so LLM-written terrain code is hard to break. Direct precedent for RewardSculptor's environment-authoring milestone: represent courses as generated code against a fixed terrain API, and close the loop by feeding policy success statistics back into the LLM to iterate course difficulty. Grounds the decision that the LLM should emit course-generator programs, not static geometry. The closest published system to RewardSculptor's next milestone — it validates envs-as-code + LLM mutation + performance-based selection for legged robots specifically. Its concrete decisions to borrow: population-based env code sampling per generation (not a single edit), passing per-terrain success statistics back into the authoring prompt, and using success-rate bands to decide which generated terrains are promoted into the next generation's prompt context."
  - arxiv_id: "2405.15568"
    title: "OMNI-EPIC: Open-endedness via Models of human Notions of Interestingness with Environments Programmed in Code"
    year: 2024
    tier: "S"
    tags: ["llm-env-gen", "ued-curricula"]
    rationale: "[llm-env-gen+ued-curricula] The clearest precedent for env+reward co-generation as separate but jointly-authored code artifacts — exactly RewardSculptor's structure once env authoring is added. Grounds the task archive (library of past env specs with train outcomes, reused as few-shot context) and an explicit learnability/interestingness gate before a task enters training. The general blueprint RewardSculptor's milestone instantiates: env-as-code generation + archive-conditioned prompting + a two-gate filter (learnable? interesting/novel?) before a task is admitted. Its specific transferable decisions: store natural-language task descriptions alongside code in the archive for similarity-based novelty checks, and route failed-to-learn tasks back to the author as simplification requests — exactly the diagnose→edit loop extended from reward to env."
  - arxiv_id: "2407.16186"
    title: "Automatic Environment Shaping is the Next Frontier in RL"
    year: 2024
    tier: "S"
    tags: ["llm-env-gen", "objects"]
    rationale: "[llm-env-gen+objects] The thesis statement for RewardSculptor's whole roadmap; cite as the framing that reward shaping (done) and environment authoring (next milestone) are two halves of one environment-shaping problem. Its taxonomy of shapeable components (obs/action/reward/dynamics/terrain/curriculum) is a checklist for what the env schema should eventually expose. The thesis statement for RewardSculptor's next milestone: a prompt must compile to the WHOLE env tuple (object specs, init-state distributions, observation exposure of object state, terminations, success gates), not just a reward function. Grounds widening the generated artifact from reward code to a full environment schema."
  - arxiv_id: "2406.01967"
    title: "DrEureka: Language Model Guided Sim-To-Real Transfer"
    year: 2024
    tier: "S"
    tags: ["llm-env-gen", "ued-curricula"]
    rationale: "[llm-env-gen+ued-curricula] The direct precedent for LLM-authored environment *parameters* (physics/dynamics ranges) as opposed to geometry: grounds a pipeline stage where proposed env parameter ranges are empirically feasibility-probed with a base policy before the LLM commits distributions — a validation gate RewardSculptor should apply to any authored terrain/dynamics randomization. The direct precedent for LLM-authored env/DR surfaces in legged robotics, and its key trick transfers verbatim: before letting the LLM set DR ranges, run cheap perturbation probes to find the policy's break points and feed those measurements into the authoring prompt. Grounds RewardSculptor's split between validated env-spec surface (probed bounds) and LLM-proposed distributions within them."
  - arxiv_id: "2310.01361"
    title: "GenSim: Generating Robotic Simulation Tasks via Large Language Models"
    year: 2023
    tier: "S"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds code-as-task with hard validation gates: an authored env/task must compile, load in the simulator, and be demonstrably solvable before it's admitted to training. Also grounds the growing few-shot task library — retrieved past specs seed new generations — and the goal-directed vs exploratory generation split (user-prompted vs system-proposed environments)."
  - arxiv_id: "2311.01455"
    title: "RoboGen: Towards Unleashing Infinite Data for Automated Robot Learning via Generative Simulation"
    year: 2023
    tier: "S"
    tags: ["llm-env-gen", "objects"]
    rationale: "[llm-env-gen+objects] The canonical end-to-end blueprint for prompt -> task -> scene spec -> supervision -> training that RewardSculptor's pipeline instantiates for MuJoCo legged robots. Grounds the decomposition where scene generation and reward generation are distinct pipeline stages sharing one task description, and per-subtask choice of training method. The direct end-to-end blueprint for RewardSculptor's milestone: it validates the pipeline shape prompt -> (object/scene spec) -> (task decomposition) -> (per-subtask reward + learning-method choice). Its key transferable decision: keep asset placement generation and reward generation as separately verifiable artifacts."
  - arxiv_id: "2312.09067"
    title: "Holodeck: Language Guided Generation of 3D Embodied AI Environments"
    year: 2023
    tier: "S"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] The key architectural precedent for LLM-emits-constraints, solver-emits-coordinates: in a prompt->env-spec->MuJoCo pipeline, the LLM should author a declarative spec (relations, ranges, counts) and deterministic placement/solver code should ground it — keeping specs editable, re-solvable, and CAD-like rather than baked coordinates."
  - arxiv_id: "2502.08844"
    title: "MuJoCo Playground"
    year: 2025
    tier: "S"
    tags: ["terrain", "sim-frameworks"]
    rationale: "[terrain+sim-frameworks] The direct engineering reference for RewardSculptor's stack (MuJoCo/mjlab + PPO): how to do terrain in MJX where model shapes are compiled — hfield data can be written per-environment but hfield dimensions/topology cannot vary per rollout, pushing the schema toward fixed-resolution heightfield tiles whose DATA is the parametric payload, plus a fixed roster of obstacle geoms resized/repositioned within compiled limits. Note MuJoCo hfield semantics (engine docs, no standalone paper): hfields are rectangular grids with prism-based collision; tall thin steps and razor edges are better represented as box geoms, which is why legged_gym/Isaac Lab convert stair-like heightfields to trimesh — in MuJoCo the analogous choice is hfield for rough/slopes and boxes for stairs/platforms/gaps. Confirms across both GPU backends (MJX and Warp) that per-env variation is numeric-model-field expansion, never structural; useful secondary reference for DR-field design."
  - arxiv_id: "2406.10759"
    title: "Humanoid Parkour Learning"
    year: 2024
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Anchor for the humanoid branch: its terrain suite (fractal rough base + platforms/hurdles/gaps/stairs) is a proven G1-relevant terrain type inventory, and its obstacle dimensions give concrete parameter-range endpoints for a humanoid difficulty schedule. Proves the quadruped course grammar (strips + difficulty rows + fractal noise) transfers to humanoids nearly unchanged — the schema does not need a separate humanoid course representation, only different parameter bounds and a global surface-noise field parameter."
  - arxiv_id: "2301.04195"
    title: "Orbit: A Unified Simulation Framework for Interactive Robot Learning Environments"
    year: 2023
    tier: "S"
    tags: ["terrain", "sim-frameworks"]
    rationale: "[terrain+sim-frameworks] The closest existing artifact to 'CAD-like parametric environment authoring': every terrain is a dataclass config (type name + parameter ranges + proportion weight) compiled into a tiled mesh. RewardSculptor's LLM-emitted terrain schema should mirror this config-as-code pattern (typed sub-terrain entries, proportions, difficulty ranges), which also makes diffs/edits natural. mjlab is an explicit port of this API onto MuJoCo-Warp; its terrain grid (rows=difficulty, cols=type, flat_patch_sampling, env-origin curriculum) is the pattern RewardSculptor's terrain schema should compile into."
  - arxiv_id: "2306.14874"
    title: "ANYmal Parkour: Learning Agile Navigation for Quadrupedal Robots"
    year: 2023
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Grounds a skill-major decomposition of the environment schema: obstacle modules (gap, box, ramp, crawl-bar) as composable scene objects with per-module parameter ranges and per-module curricula, then courses assembled by sequencing modules. This is the 'objects and obstacles' half of prompt-driven authoring, complementary to tiled heightfield terrain. The canonical skill-decomposition alternative to end-to-end: grounds a schema where each course segment is tagged with an obstacle type that maps to a skill, and where per-skill feasibility envelopes (max box height, max gap) validate whether a prompted course is traversable at all."
  - arxiv_id: "2309.14341"
    title: "Extreme Parkour with Legged Robots"
    year: 2023
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Evidence that one policy + one simple reward can cover an extreme terrain family if the terrain curriculum carries the difficulty — reinforcing terrain authoring as the lever RewardSculptor should pull instead of multiplying reward terms. Obstacle parameter ranges (heights/gaps relative to body dimensions) grounds expressing schema ranges in body-normalized units. Grounds three schema decisions: (1) each obstacle primitive carries a scalar difficulty knob mapped to physical dimensions, (2) waypoints along the course are the goal-specification mechanism, and (3) one continuous course strip per terrain cell rather than isolated obstacles."
  - arxiv_id: "2309.05665"
    title: "Robot Parkour Learning"
    year: 2023
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Adds a non-geometric curriculum axis to the schema: obstacle 'softness'/penetration allowance as a curriculum parameter, letting early training pass through geometry that later becomes rigid. A parametric environment layer should support per-object collision softness scheduling, not just size/spacing ramps. Grounds the schema's per-obstacle-type parameter dictionaries (one canonical scalar per skill: height/gap/clearance/width) and a soft-to-hard contact curriculum flag on obstacles — penetrable-then-solid geometry is a concrete, implementable curriculum axis in MuJoCo."
  - arxiv_id: "2305.14654"
    title: "Barkour: Benchmarking Animal-level Agility with Quadruped Robots"
    year: 2023
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] Grounds the evaluation half of environment authoring: a fixed, parametrically defined benchmark course with a scalar score lets successive reward/terrain iterations be compared. RewardSculptor should emit not just training terrain but a frozen eval course + metric per mission. Grounds course-level evaluation in the schema: a course is not just geometry but (obstacle sequence, timing-based score, per-obstacle success/penalty rules) — i.e., the prompt should compile to a scoring function alongside the layout, enabling apples-to-apples comparison across generated courses."
  - arxiv_id: "2201.08117"
    title: "Learning robust perceptive locomotion for quadrupedal robots in the wild"
    year: 2022
    tier: "S"
    tags: ["terrain"]
    rationale: "[terrain] Defines the observation contract terrain imposes: a height-scanner grid (ring/grid of query points around base/feet) sampled from the terrain heightfield is the standard perceptive observation, and the terrain schema must support efficient height queries at arbitrary (x,y) to serve it. Also grounds injecting parametric elevation-map noise (offsets, outliers, missing data) as part of the environment spec."
  - arxiv_id: "2203.01302"
    title: "Evolving Curricula with Regret-Based Environment Design"
    year: 2022
    tier: "S"
    tags: ["terrain", "ued-curricula"]
    rationale: "[terrain+ued-curricula] Directly grounds the 'editable like CAD' requirement: if terrains are parameter vectors, curriculum can operate by small edits to existing high-learning-value terrains (bump one stair height, widen one gap) rather than fresh sampling — a natural fit for an LLM/heuristic editor over a parametric schema, with regret/value-loss as the selection signal. The closest algorithmic template for the milestone: the LLM's role maps to ACCEL's edit operator — mutate the current highest-regret env config (raise a step, add a gap, widen a friction range) rather than authoring de novo each iteration. Grounds the design decision that env-parameter mutation should be small, local, and applied to buffer-resident high-regret parents."
  - arxiv_id: "2109.11978"
    title: "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning"
    year: 2021
    tier: "S"
    tags: ["terrain", "parkour", "ued-curricula"]
    rationale: "[terrain+parkour+ued-curricula] This IS the reference schema for the parametric terrain layer: a small set of typed terrain generators, each exposing 1-3 scalar difficulty knobs, laid out on a tile grid. Grounds the promotion/demotion rule (distance-traversed threshold per episode, per-robot level assignment) and the choice to make 'difficulty' a single normalized scalar that maps to per-type parameter ranges — exactly the structure an LLM should emit. This is the substrate a prompt-to-course system should emit into: grounds the decision to compile a prompt into (terrain-type column, difficulty-parameterization function, row count) triples rather than one fixed course, getting per-robot auto-curriculum for free in mjx/mjlab parallel training. Grounds the population-level implementation of adaptive difficulty in RewardSculptor's actual training stack (MJX PPO with thousands of parallel envs): difficulty is a per-env-instance integer level with promote/demote rules evaluated at episode termination, and the resulting occupancy histogram over levels is itself a free diagnostic signal the diagnoser can read to see where the policy's frontier sits."
  - arxiv_id: "2010.11251"
    title: "Learning Quadrupedal Locomotion over Challenging Terrain"
    year: 2020
    tier: "S"
    tags: ["terrain"]
    rationale: "[terrain] Grounds two decisions: (1) terrain parameter vectors (e.g. step height, roughness amplitude, slope) can be sampled adaptively by measuring per-parameter-cell success and concentrating samples where success is intermediate (~50%), an alternative to Rudin's grid promotion; (2) a small parametric terrain family generalizes far beyond its literal geometry, so the schema does not need to enumerate every real-world terrain."
  - arxiv_id: "2005.04323"
    title: "ALLSTEPS: Curriculum-driven Learning of Stepping Stone Skills"
    year: 2020
    tier: "S"
    tags: ["terrain", "parkour"]
    rationale: "[terrain+parkour] The template for foothold-constrained terrain objects in the schema: stepping stones as a sequence generator with (spacing, height delta, yaw) ranges. Grounds an ablation-backed promotion rule: adapt each parameter range independently based on recent success rate, rather than one global difficulty scalar, for terrain types with multi-dimensional difficulty. Grounds relative parameterization for sparse-foothold course elements: author stepping-stone segments as sequences of relative (distance, height, yaw) offsets with difficulty = sampled range width, and always attach an adaptive range-expansion curriculum — fixed ranges demonstrably fail."
  - arxiv_id: "2403.10506"
    title: "HumanoidBench: Simulated Humanoid Benchmark for Whole-Body Locomotion and Manipulation"
    year: 2024
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] The closest existing artifact to RewardSculptor's target output: humanoid + hands + object + goal + reward + success-gate per task, in MuJoCo. Grounds (a) how hands/grippers are attached as swappable end-effector subtrees in the robot spec, and (b) per-task success thresholds decoupled from reward — plus evidence that generated tasks should ship with low-level skill scaffolding or they will be untrainable."
  - arxiv_id: "2406.02523"
    title: "RoboCasa: Large-Scale Simulation of Everyday Tasks for Generalist Robots"
    year: 2024
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] The strongest precedent for prompt-driven scene+object authoring at scale: an asset registry with category-level object sampling, LLM-composed tasks over a fixed predicate vocabulary, and placement randomization as data amplifier. Grounds schema fields: object category -> asset sampler, per-task scene predicates, and placement distributions."
  - arxiv_id: "2407.00187"
    title: "SMPLOlympics: Sports Environments for Physically Simulated Humanoids"
    year: 2024
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] Grounds a reusable library of sports-goal predicates (ball-into-goal, ball-over-net, ball-through-hoop, object-past-line) that a prompt compiler can instantiate, and the design rule that with a motion prior in place the generated task reward can stay near-sparse — shifting LLM effort from dense shaping to correct goal predicates."
  - arxiv_id: "2304.01159"
    title: "DribbleBot: Dynamic Legged Manipulation in the Wild"
    year: 2023
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] Grounds a 'goal = commanded object velocity' goal type in the schema, distinct from positional goals. Also grounds object-spec fields for rolling dynamics (friction, rolling resistance, drag) and an object-observation-noise randomization block as first-class parts of a generated ball task."
  - arxiv_id: "2304.13653"
    title: "Learning Agile Soccer Skills for a Bipedal Robot with Deep Reinforcement Learning"
    year: 2023
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] The canonical reward-vs-metric separation for a scored object task: success gate = geometric predicate 'ball inside goal region,' shaped reward = ball-velocity-toward-goal-region — a prompt->schema compiler can emit both mechanically from one goal-region spec. Also grounds skill-distillation staging when a single prompt implies multiple skills (walk, kick, recover)."
  - arxiv_id: "2312.04393"
    title: "PhysHOI: Physics-Based Imitation of Dynamic Human-Object Interaction"
    year: 2023
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] The contact graph is the missing formal object in most reward-generation schemas: a prompt like 'kick the ball' compiles to desired contact pairs (foot-ball: yes, hands-ball: no) from which contact sensors, contact rewards, and illegal-contact penalties are derived mechanically. Directly grounds a contact_spec field with per-pair desired/forbidden flags."
  - arxiv_id: "1802.09464"
    title: "Multi-Goal Reinforcement Learning: Challenging Robotics Environments and Request for Research"
    year: 2018
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] The single most direct precedent for the schema's success-gate design: goal = target object pose, success = dist(achieved, desired) < threshold, with the threshold an explicit, prompt-settable field. RewardSculptor's generated envs should expose achieved_goal/desired_goal explicitly to keep relabeling and metric computation mechanical."
  - arxiv_id: "1707.01495"
    title: "Hindsight Experience Replay"
    year: 2017
    tier: "S"
    tags: ["objects"]
    rationale: "[objects] Constrains the schema: success predicates should be defined on a relabelable object-state subspace (distance-to-goal thresholds on object pose), so HER-style relabeling is available for free when LLM-authored dense rewards fail. Argues the compiler should always emit the sparse predicate even when it also emits shaping."
  - arxiv_id: "2408.15099"
    title: "No Regrets: Investigating and Improving Regret Approximations for Curriculum Discovery"
    year: 2024
    tier: "S"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] This is the single most defensible difficulty metric for the diagnoser: score each authored env config by p(1-p) from a handful of eval rollouts, and prioritize configs near 50% success. It also justifies the success-rate-banded promotion already used in parkour work, and its CVaR-over-worst-levels evaluation is the right robustness report for each RewardSculptor iteration."
  - arxiv_id: "2110.02439"
    title: "Replay-Guided Adversarial Environment Design"
    year: 2021
    tier: "S"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] Directly grounds a two-stage loop for RewardSculptor: LLM authors candidate env configs (generator), cheap evaluation rollouts score them, but PPO gradient updates happen only on configs that pass the curator's regret/learnability bar. The counterintuitive 'evaluate on it, don't train on it' split is the specific rule worth copying."
  - arxiv_id: "2012.02096"
    title: "Emergent Complexity and Zero-shot Transfer via Unsupervised Environment Design"
    year: 2020
    tier: "S"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] This is the theoretical spine for any diagnoser that scores authored envs: regret, not raw failure, is the correct selection signal, because it automatically excludes unsolvable levels. RewardSculptor's diagnoser can approximate regret without a second agent via best-observed-return minus current-mean-return per env config — a documented proxy from this line."
  - arxiv_id: "1910.07113"
    title: "Solving Rubik's Cube with a Robot Hand"
    year: 2019
    tier: "S"
    tags: ["ued-curricula"]
    rationale: "[ued-curricula] The canonical per-parameter promotion rule for an LLM-authored env space: represent each authored env dimension as [lo, hi] with performance-thresholded boundary sampling, and let the diagnoser widen/narrow each dimension independently. Also grounds the claim that recurrent policies (already standard in legged RL) are what convert a wide ADR distribution into online system identification."
  - arxiv_id: "2601.22074"
    title: "mjlab: A Lightweight Framework for GPU-Accelerated Robot Learning"
    year: 2026
    tier: "S"
    tags: ["sim-frameworks"]
    rationale: "[sim-frameworks] The actual compile target — the schema must emit exactly what SceneCfg consumes (TerrainEntityCfg/TerrainGeneratorCfg/SubTerrainCfg, EntityCfg.spec_fn, SensorCfg tuple), and its terrain/DR split defines what may vary per env."
  - arxiv_id: "2006.12983"
    title: "dm_control: Software and Tasks for Continuous Control"
    year: 2020
    tier: "S"
    tags: ["sim-frameworks"]
    rationale: "[sim-frameworks] The Entity abstraction (self-contained MJCF-producing unit with attach/detach namespacing and lifecycle hooks) is the direct ancestor of MjSpec attach and mjlab EntityCfg; the cleanest model for what a compiled schema 'object' should be."

  # ── A-tier (strong prior art) ─────────────────────────────────
  - arxiv_id: "2602.06366"
    title: "Towards Adaptive Environment Generation for Training Embodied Agents"
    year: 2026
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] A 2026 distillation of the design RewardSculptor needs: controllable/parametric env representation + rich diagnostics -> targeted edits. Grounds instrumenting the env spec so every parameter is an adaptation knob, and logging failure modes (where/why the robot fails) rather than scalar returns as the feedback interface."
  - arxiv_id: "2602.09153"
    title: "SceneSmith: Agentic Generation of Simulation-Ready Indoor Scenes"
    year: 2026
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds staged generation with per-stage validation (structure -> large elements -> details), and quantitative physics gates (collision rate, stability under simulation) as the acceptance criteria for a compiled scene — directly portable to a MuJoCo settle-test: load, step physics, verify nothing moves/penetrates before training starts."
  - arxiv_id: "2602.10116"
    title: "SAGE: Scalable Agentic 3D Scene Generation for Embodied AI"
    year: 2026
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds the generator/critic separation for env authoring: independent validator agents (semantic: does the scene match the prompt; physical: is it stable/solvable) gate refinement iterations, rather than trusting one generation pass — a concrete pattern for RewardSculptor's spec-review stage before compilation to MJCF."
  - arxiv_id: "2502.13092"
    title: "Text2World: Benchmarking Large Language Models for Symbolic World Model Generation"
    year: 2025
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds the validation-gate design for structured env specs: correctness of an LLM-emitted spec must be judged by executing it (parse -> ground -> simulate) against multiple criteria, and error-message-driven repair loops measurably help — i.e., budget for a compile-diagnose-repair cycle in the env authoring loop, not one-shot generation."
  - arxiv_id: "2403.12014"
    title: "EnvGen: Generating and Adapting Environments via LLMs for Training Embodied Agents"
    year: 2024
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds the cheap outer loop: environment adaptation should consume aggregated training metrics (per-skill/per-terrain success rates), not per-step LLM calls, and should emit edits to a structured env config rather than regenerate from scratch. Also grounds mixing generated environments with the base (flat-ground) environment to avoid catastrophic forgetting of core skills."
  - arxiv_id: "2409.18382"
    title: "CurricuLLM: Automatic Task Curricula Design for Learning Complex Robot Skills using Large Language Models"
    year: 2024
    tier: "A"
    tags: ["llm-env-gen", "parkour"]
    rationale: "[llm-env-gen+parkour] Grounds curriculum promotion rules for a legged-robot pipeline: promotion decisions made by an LLM reading summarized trajectory statistics, and goal distributions authored as code alongside rewards — directly applicable to goal-conditioned task specs (target boxes, waypoints) in the env schema. Grounds treating goal distribution as first-class generated code alongside reward and geometry: a prompted course should compile to (layout, reward, goal/waypoint sampling distribution) triples, and subtask sequencing gives a template for staging 'walk, then hurdle, then full course' curricula from one prompt."
  - arxiv_id: "2410.03645"
    title: "GenSim2: Scaling Robot Data Generation with Multi-modal and Reasoning LLMs"
    year: 2024
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds pairing every generated task with an automated solver that must produce successful demonstrations — a stronger solvability gate than static checks — and using VLM review of rendered scenes as part of task verification. Relevant to RewardSculptor's BC warm-start: generated envs should ship with a scripted/planned demo for Demo-RSI."
  - arxiv_id: "2405.03709"
    title: "ScenicNL: Generating Probabilistic Scenario Programs from Natural Language"
    year: 2024
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] The strongest precedent for prompt -> validated program in a scenario DSL: grounds (1) representing an environment as a *distribution-valued* spec (parameters as ranges, matching CAD-like editability plus domain randomization), and (2) compiler-in-the-loop repair for a DSL the base LLM has barely seen — which will be true of any custom RewardSculptor env schema."
  - arxiv_id: "2307.14535"
    title: "Scaling Up and Distilling Down: Language-Guided Robot Skill Acquisition"
    year: 2023
    tier: "A"
    tags: ["llm-env-gen"]
    rationale: "[llm-env-gen] Grounds success-checker code as a first-class generated artifact, separate from the shaped reward: the env spec should carry an LLM-authored, executable success predicate used for evaluation gating and data labeling, so shaped-reward hacking can't inflate reported success."
