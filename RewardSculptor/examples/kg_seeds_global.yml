# Global KG seeds — curated from AME456/files research log + M1/M5 library
# references + foundational RL literature + canonical robotics repos.
#
# Ingest into an existing project's KG with:
#   cd ~/.local/share/reward-sculptor/projects/<slug>
#   uv run --project ~/projects/RewardSculptor sculpt kg ingest \
#       ~/projects/RewardSculptor/examples/kg_seeds_global.yml
#
# Schema matches sculptor.kg.ingest.ingest_from_seeds:
#   papers: list of { arxiv_id, title?, authors?, year? }
# `title` / `authors` / `year` are optional hints; the ingest pipeline
# re-fetches metadata from arxiv anyway. They're here for fallback when
# arxiv is rate-limited (HTTP 429) and also for human readability.

