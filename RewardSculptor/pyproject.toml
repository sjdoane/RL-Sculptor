[project]
name = "reward-sculptor"
version = "0.1.0"
description = "Standalone, lab-agnostic agent that iterates on RL reward functions, grounded in a knowledge graph of legged-robotics papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Doane", email = "sjdoane@usc.edu" }]
dependencies = [
    "anthropic>=0.96.0",
    "arxiv>=3.0.0",
    "gymnasium[mujoco]>=1.2.3",
    "imageio-ffmpeg>=0.6.0",
    "mjlab[cu128]>=1.3.0",
    "pypdf>=6.10.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "robot-descriptions>=1.23.0",
    "sentence-transformers>=5.4.1",
    "stable-baselines3>=2.8.0",
    "tomli>=2.4.1",
    "torch>=2.11.0",
    "typer>=0.24.1",
]

[project.scripts]
sculpt = "sculptor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sculptor"]

[tool.hatch.build.targets.wheel.force-include]
"sculptor/prompts" = "sculptor/prompts"
"sculptor/assets" = "sculptor/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: tests that require an NVIDIA GPU + mjlab stack; auto-skipped otherwise",
]
