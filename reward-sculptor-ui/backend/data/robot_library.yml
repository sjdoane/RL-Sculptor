# Robot library manifest (MJLAB_PIVOT_DESIGN §4, M3).
#
# - `source`: "menagerie" (via robot_descriptions), "mjlab_builtin"
#   (Cartpole toy), "gymnasium_builtin" (MuJoCo Gymnasium envs).
# - `training_support`: "mjlab_ready" (task registered in mjlab registry;
#   load-time validation in services/robot_library.py auto-demotes to
#   preview_only if the task_id is not present in the running mjlab
#   install), "preview_only" (URDF/MJCF loadable but no training path),
#   "gymnasium_compatible" (legacy gym_sb3 path).
# - `is_smoke_test_target`: true for Cartpole only; UI category filter
#   hides "Other" by default so Cartpole doesn't clutter the browser.
# - `reference_robot`: exact namespace used by reference clips and portable
#   policy contracts. Required for every entry; never inferred from `slug` or
#   a task id. It may differ from the catalog asset slug (unitree_g1 -> g1).
# - `references`: verified URLs only. preview_only entries ship with
#   `references: []` unless a canonical paper + repo was hand-verified
#   during research.

robots:
  # ── mjlab_ready (6 robots, 14 tasks) ──────────────────────────────────────
  - slug: cartpole_mjlab
    reference_robot: cartpole_mjlab
    display_name: "Cartpole (toy)"
    category: Other
    description: "Classical cart-pole stabilization toy task; ships inside mjlab for smoke testing."
    source: mjlab_builtin
    menagerie_package: null
    training_support: mjlab_ready
    is_smoke_test_target: true
    preconfigured_tasks:
      - task_id: Mjlab-Cartpole-Balance
        display_name: "Balance upright cartpole"
        recommended_num_envs: 4096
      - task_id: Mjlab-Cartpole-Swingup
        display_name: "Swingup from hanging"
        recommended_num_envs: 4096
    references: []
    thumbnail_path: robots/cartpole_mjlab.webp

  - slug: unitree_go1
    reference_robot: go1
    display_name: "Unitree Go1"
    category: Quadruped
    description: "Unitree Go1 quadruped (~12 kg, 12 actuated joints). Canonical sim-to-real legged locomotion platform."
    source: menagerie
    menagerie_package: go1_mj_description
    training_support: mjlab_ready
    is_smoke_test_target: false
    preconfigured_tasks:
      - task_id: Mjlab-Velocity-Flat-Unitree-Go1
        display_name: "Velocity tracking (flat)"
        recommended_num_envs: 2048
      - task_id: Mjlab-Velocity-Rough-Unitree-Go1
        display_name: "Velocity tracking (rough terrain)"
        recommended_num_envs: 2048
    references:
      - kind: paper
        url: https://arxiv.org/abs/2212.03238
        citation: "Margolis & Agrawal, Walk These Ways, CoRL 2022"
      - kind: paper
        url: https://arxiv.org/abs/2208.07860
        citation: "Smith et al., A Walk in the Park, arXiv 2022"
      - kind: paper
        url: https://arxiv.org/abs/2109.11978
        citation: "Rudin et al., Learning to Walk in Minutes (legged_gym), CoRL 2021"
      - kind: repo
